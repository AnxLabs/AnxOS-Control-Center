<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#08070d">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AnxOS">
  <meta name="referrer" content="no-referrer">
  <title>AnxOS</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/128.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/180.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app" data-app>
    <header class="topbar">
      <button class="topbar__back" type="button" data-back hidden aria-label="Back">‹</button>
      <h1 class="topbar__title" data-title>AnxOS</h1>
      <span class="topbar__status" data-status role="status" aria-live="polite"></span>
    </header>
    <div class="banner" data-banner role="alert" hidden></div>
    <main class="view" data-view tabindex="-1"></main>
    <nav class="tabbar" data-tabbar aria-label="Sections" hidden>
      <a class="tabbar__item" href="#/home" data-tab="home"><span class="tabbar__icon" aria-hidden="true">⌂</span><span>Home</span></a>
      <a class="tabbar__item" href="#/servers" data-tab="servers"><span class="tabbar__icon" aria-hidden="true">▤</span><span>Servers</span></a>
      <a class="tabbar__item" href="#/computers" data-tab="computers"><span class="tabbar__icon" aria-hidden="true">▣</span><span>Computers</span></a>
      <a class="tabbar__item" href="#/sharing" data-tab="sharing"><span class="tabbar__icon" aria-hidden="true">⇄</span><span>Sharing</span></a>
      <a class="tabbar__item" href="#/more" data-tab="more"><span class="tabbar__icon" aria-hidden="true">⋯</span><span>More</span></a>
    </nav>
  </div>
  <div class="sheet-backdrop" data-sheet-backdrop hidden></div>
  <section class="sheet" data-sheet role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></section>
  <div class="toast" data-toast role="status" aria-live="polite" hidden></div>
  <script src="/shared/homeDashboardModel.js"></script>
  <script src="/shared/serverViewModel.js"></script>
  <script src="/app.js"></script>
</body>
</html>
