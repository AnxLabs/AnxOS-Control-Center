name: Deploy Website to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production website branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: website-source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # A website deploy is an explicit, operator-initiated action. It never
      # runs from a release or an RC tag, so an RC can never auto-promote into
      # the stable website state. The consistency guard below refuses to deploy
      # if the committed website config does not exactly match the current
      # public stable (non-preliminary) release.
      - name: Verify required deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [[ -n "$CLOUDFLARE_PAGES_PROJECT" ]] || missing+=(CLOUDFLARE_PAGES_PROJECT)
          if (( ${#missing[@]} )); then
            echo "Missing Cloudflare Pages configuration: ${missing[*]}" >&2
            exit 1
          fi
          grep -Eq 'buildNumber: "[0-9]+"' website-source/website/config.js

      - name: Refuse inconsistent or stale website metadata
        working-directory: website-source
        run: node scripts/verify-website-config-vs-stable.js

      - name: Deploy website to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PAGES_PROJECT || secrets.CLOUDFLARE_PAGES_PROJECT }}
          directory: website-source/website