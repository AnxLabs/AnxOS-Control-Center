name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  # Release and signing runs are never cancelled after they have started.
  cancel-in-progress: false

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tracked JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          git ls-files '*.js' -z | xargs -0 -r -n1 node --check

  rc-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Electron cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-download-v1-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-download-v1-

      - name: Install dependencies
        run: npm ci

      - name: Install virtual display for Electron validation
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          echo "DISPLAY=${DISPLAY:-<unset>}"
          command -v Xvfb
          command -v xvfb-run
          Xvfb -version 2>&1 | head -n 1 || true
          xvfb-run --help 2>&1 | head -n 1 || true

      - name: Run RC validation
        run: |
          set -o pipefail
          echo "DISPLAY=${DISPLAY:-<unset>}"
          xvfb-run -a -s "-screen 0 1920x1080x24" npm run rc:validate 2>&1 | tee rc-validate.log

      - name: Collect validation process diagnostics
        if: always()
        shell: bash
        run: |
          echo "DISPLAY=${DISPLAY:-<unset>}"
          ps -eo pid,ppid,stat,cmd | grep -E 'electron|xvfb|node' || true
          ss -ltnp || true

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-validation-log
          path: rc-validate.log
          if-no-files-found: ignore
          retention-days: 7

  windows:
    needs:
      - static-validation
      - rc-validation
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Electron cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: ${{ runner.os }}-electron-download-v1-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-download-v1-

      - name: Restore electron-builder cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-builder-v1-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-v1-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Restore verified runtime bundle cache
        uses: actions/cache@v4
        with:
          path: resources/bundled-runtimes/win-x64
          key: ${{ runner.os }}-anxos-runtime-bundle-v1-${{ hashFiles('config/windows-runtime-bundle.json', 'scripts/prepare-windows-runtime-bundle.js') }}

      - name: Prepare verified bundled runtimes
        run: npm run runtimes:prepare:win

      # Signing is optional for local builds but CI rejects partial Azure configuration.
      - name: Report Windows signing mode
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $names = @("AZURE_TENANT_ID", "AZURE_CLIENT_ID", "AZURE_CLIENT_SECRET", "AZURE_TRUSTED_SIGNING_ENDPOINT", "AZURE_TRUSTED_SIGNING_ACCOUNT_NAME", "AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME", "AZURE_TRUSTED_SIGNING_PUBLISHER_NAME")
          $present = @($names | Where-Object { -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($present.Count -eq 0) {
            "Windows Azure Trusted Signing: disabled (unsigned build)."
          } elseif ($present.Count -ne $names.Count) {
            $missing = $names | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
            throw "Azure Trusted Signing configuration is partial. Missing: $($missing -join ', ')"
          } else {
            "Windows Azure Trusted Signing: enabled."
          }

      - name: Build Windows installer
        run: npm run dist:win -- --publish never --no-increment-build
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}

      # signtool verification is separate from signing so a successful build cannot hide an invalid signature.
      - name: Verify Windows Authenticode signatures
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          node scripts/verify-windows-signatures.js

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anxos-control-center-windows
          path: |
            dist/AnxOS-Control-Center-Setup-*.exe
            dist/AnxOS-Control-Center-Setup-*.exe.blockmap
            dist/AnxOS-Control-Center-*-portable.exe
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  linux:
    needs:
      - static-validation
      - rc-validation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Electron cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-download-v1-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-download-v1-

      - name: Restore electron-builder cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-builder-v1-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-v1-

      - name: Install dependencies
        run: npm ci

      # Linux does not use Azure signing; the shared Builder config remains unsigned here.
      - name: Build Linux packages
        run: npm run dist:linux -- --publish never --no-increment-build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anxos-control-center-linux
          path: |
            dist/AnxOS-Control-Center-*.deb
            dist/AnxOS-Control-Center-*.AppImage
            dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows
      - linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release notes and metadata scripts
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Setup Node for release metadata
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Publishing is tag-only; artifacts are validated before any release upload.
      - name: Generate updater manifest
        shell: bash
        run: |
          mkdir -p dist
          cp release-artifacts/AnxOS-Control-Center-* dist/
          npm run updates:manifest
          cp dist/update-manifest.json release-artifacts/update-manifest.json

      - name: Generate SHA-256 checksum manifest
        shell: bash
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS

      - name: Validate release artifact set
        run: node scripts/validate-release-artifacts.js --directory release-artifacts

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ secrets.ANXOS_RELEASE_REPO_TOKEN }}
          ANXOS_RELEASE_REPOSITORY: bungopam-byte/AnxOS-Control-Center-Releases
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ANXOS_RELEASE_REPO_TOKEN is required to publish public release assets." >&2
            exit 1
          fi

          NOTES_FILE="RELEASE_NOTES_${GITHUB_REF_NAME#v}.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS=(--notes "Desktop installers and portable builds for AnxOS Control Center ${GITHUB_REF_NAME}.")
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$ANXOS_RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$ANXOS_RELEASE_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --prerelease \
              "${NOTES_ARGS[@]}"
            gh release upload "$GITHUB_REF_NAME" release-artifacts/* \
              --repo "$ANXOS_RELEASE_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-artifacts/* \
              --repo "$ANXOS_RELEASE_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --prerelease \
              "${NOTES_ARGS[@]}"
          fi
