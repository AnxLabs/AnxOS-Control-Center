name: Promote Release to Stable

# Explicit publication gate. An RC/tag is created as a pre-release by the Desktop
# Release workflow and is never automatically treated as the public stable "latest".
# Promoting a build to public stable is a separate, operator-initiated action that:
#   1. regenerates and commits the website metadata for that build to `dev`,
#   2. flips the release from pre-release to the stable latest via the GitHub API,
#   3. updates the source-repository release pointer, and
#   4. triggers the guarded Cloudflare Pages deploy (which itself refuses stale config).
# No assets are re-uploaded and no historical release is modified.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to promote to public stable, e.g. v1.9-build200'
        required: true
        type: string

permissions:
  contents: write
  # The final step dispatches cloudflare-pages-deploy.yml; workflow dispatch
  # requires actions:write, which GITHUB_TOKEN does not have implicitly.
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the release is an unpromoted RC
        env:
          GH_TOKEN: ${{ secrets.ANXOS_RELEASE_REPO_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+-build[0-9]+(-[A-Za-z0-9]+)*$ ]] || { echo "Unsupported tag format: ${TAG}" >&2; exit 1; }
          if [ -z "$GH_TOKEN" ]; then
            echo "ANXOS_RELEASE_REPO_TOKEN is required to promote a public release." >&2
            exit 1
          fi
          ENDPOINT="repos/AnxLabs/AnxOS-Control-Center-Releases/releases/tags/${TAG}"
          DRAFT="$(gh api "${ENDPOINT}" --jq '.draft')"
          PRERELEASE="$(gh api "${ENDPOINT}" --jq '.prerelease')"
          RELEASE_ID="$(gh api "${ENDPOINT}" --jq '.id')"
          if [ "$DRAFT" = "true" ]; then echo "Refusing to promote the draft release ${TAG}." >&2; exit 1; fi
          if [ "$PRERELEASE" = "false" ]; then echo "Release ${TAG} is already a public stable release; refusing to re-promote." >&2; exit 1; fi
          echo "Promoting RC ${TAG} (id=${RELEASE_ID}) to public stable."
          echo "RELEASE_ID=${RELEASE_ID}" >> "$GITHUB_ENV"

      - name: Set release build for website metadata
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          BUILD_NUM="$(printf '%s' "$TAG" | sed -E 's/^v[0-9]+\.[0-9]+-build([0-9]+).*/\1/')"
          [[ "$BUILD_NUM" =~ ^[0-9]+$ ]] || { echo "Could not derive a numeric build from ${TAG}" >&2; exit 1; }
          node scripts/release-config.js build:set "$BUILD_NUM"

      - name: Generate Build website metadata
        env:
          ANXOS_RELEASE_TAG: ${{ github.event.inputs.tag }}
          ANXOS_UPDATE_BASE_URL: https://github.com/AnxLabs/AnxOS-Control-Center-Releases/releases/download/${{ github.event.inputs.tag }}
        # website:sync regenerates config.js and release-notes.json, then the static
        # HTML fallbacks, JSON-LD and README managed sections from them.
        run: npm run website:sync

      # Fail before anything is pushed or promoted if the generated outputs
      # disagree about the current release.
      - name: Check release documentation consistency
        run: |
          set -euo pipefail
          node scripts/release-docs.js --check
          node scripts/release-consistency-check.js

      - name: Commit and push promoted website metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "AnxOS Release Bot"
          git config user.email "releases@anxos.invalid"
          # Only generated release outputs: config, notes, static HTML, managed README sections.
          git add release.json website README.md docs/releases-repository/README.md
          git status --short
          # No workflow runs on pushes to dev, so this commit cannot trigger another run.
          git commit -m "chore(website): promote ${TAG} to public stable" || echo "No website metadata changes to commit."
          git push origin dev

      - name: Promote release to public stable latest
        env:
          GH_TOKEN: ${{ secrets.ANXOS_RELEASE_REPO_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          # GitHub ignores make_latest when it is set in the SAME request that
          # flips prerelease status, so promote first, then mark Latest in a
          # second PATCH, and finally assert the public Latest actually moved.
          gh api --method PATCH "repos/AnxLabs/AnxOS-Control-Center-Releases/releases/${RELEASE_ID}" -f prerelease=false
          gh api --method PATCH "repos/AnxLabs/AnxOS-Control-Center-Releases/releases/${RELEASE_ID}" -f make_latest=true
          LATEST_TAG="$(gh api "repos/AnxLabs/AnxOS-Control-Center-Releases/releases/latest" --jq '.tag_name')"
          if [ "${LATEST_TAG}" != "${TAG}" ]; then
            echo "Expected ${TAG} as public Latest but releases/latest reports ${LATEST_TAG}." >&2
            exit 1
          fi
          echo "Public Latest is now ${LATEST_TAG}."

      - name: Update source-repository release pointer to stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            # The pointer release must stop being a prerelease BEFORE --latest,
            # otherwise the API rejects the edit with 422 (Latest cannot be prerelease).
            gh release edit "${TAG}" --prerelease=false
            gh release edit "${TAG}" --latest
          fi

      - name: Trigger guarded Cloudflare Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run cloudflare-pages-deploy.yml --ref dev

      # Rewrites only the managed "Latest release" section of the Releases
      # repository README; everything outside the markers is kept. A missing token,
      # missing markers or a refused write fails this run, so a promotion whose
      # README was not updated never reports success. Promotion refuses to run twice,
      # so after fixing the cause, regenerate the README locally with
      # `node scripts/release-docs.js --releases-readme=<downloaded README>` and
      # commit it to the Releases repository by hand. The step is a no-op when the
      # section is already current.
      - name: Update the Releases repository README
        env:
          GH_TOKEN: ${{ secrets.ANXOS_RELEASE_REPO_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          API="repos/AnxLabs/AnxOS-Control-Center-Releases/contents/README.md"
          if ! gh api "${API}" > releases-readme.json; then
            echo "::error::Could not read the Releases repository README with ANXOS_RELEASE_REPO_TOKEN." >&2
            exit 1
          fi
          SHA="$(jq -r .sha releases-readme.json)"
          jq -r .content releases-readme.json | base64 -d > releases-README.md
          cp releases-README.md releases-README.before.md
          node scripts/release-docs.js --releases-readme=releases-README.md
          if cmp -s releases-README.md releases-README.before.md; then
            echo "Releases README already names ${TAG}; nothing to update."
            exit 0
          fi
          if ! gh api --method PUT "${API}" \
              -f message="docs(readme): current release ${TAG}" \
              -f content="$(base64 -w0 releases-README.md)" \
              -f sha="${SHA}" -f branch=main > /dev/null; then
            echo "::error::The Releases repository refused the README update (does the token have contents:write?). The release is promoted, but its README still names the previous build." >&2
            exit 1
          fi
          echo "Releases README updated for ${TAG}."